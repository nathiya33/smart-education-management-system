    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f6f9;
        }

        header {
            background: #243b55;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            padding: 30px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 2px 8px #ddd;
        }

        h2 {
            color: #243b55;
        }

        button {
            background: #243b55;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<header>
    <h1>Smart Education Management System</h1>
    <p>Admin Dashboard</p>
</header>

<div class="container">

    <div class="card">
        <h2>Students</h2>
        <p>Manage student information.</p>
        <button onclick="showMessage('Student Management')">
            View Students
        </button>
    </div>

    <div class="card">
        <h2>Teachers</h2>
        <p>Manage teacher information.</p>
        <button onclick="showMessage('Teacher Management')">
            View Teachers
        </button>
    </div>

    <div class="card">
        <h2>Attendance</h2>
        <p>Monitor student attendance.</p>
        <button onclick="showMessage('Attendance Management')">
            View Attendance
        </button>
    </div>

    <div class="card">
        <h2>Reports</h2>
        <p>Access educational reports.</p>
        <button onclick="showMessage('Reports')">
            View Reports
        </button>
    </div>

</div>

<script>
    function showMessage(section) {
        alert(section + " page is not connected yet.");
    }
</script>

</body>
</html>
